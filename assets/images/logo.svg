<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80" fill="none">
  <!-- Architectural Arch & Botanical Emblem -->
  <g transform="translate(10, 8)">
    <!-- Outer Arch Frame -->
    <path d="M 12 64 L 12 28 C 12 12, 52 12, 52 28 L 52 64 Z" stroke="#1C1917" stroke-width="2.5" fill="#FAF8F5" />
    <path d="M 18 64 L 18 30 C 18 18, 46 18, 46 30 L 46 64" stroke="#D97706" stroke-width="1.2" stroke-dasharray="2 2" fill="none" />
    <!-- Botanical Olive/Leaf Stem -->
    <path d="M 32 58 C 32 40, 32 26, 32 20" stroke="#1C1917" stroke-width="2" stroke-linecap="round" />
    <path d="M 32 48 C 24 45, 22 39, 25 36 C 28 36, 31 41, 32 44" fill="#D97706" opacity="0.9" />
    <path d="M 32 40 C 40 37, 42 31, 39 28 C 36 28, 33 33, 32 36" fill="#1C1917" />
    <path d="M 32 30 C 25 27, 25 21, 28 19 C 30 19, 32 23, 32 26" fill="#D97706" opacity="0.9" />
    <circle cx="32" cy="18" r="2" fill="#1C1917" />
    <!-- Base Plinth -->
    <line x1="8" y1="64" x2="56" y2="64" stroke="#1C1917" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography: Brand Name & Editorial Subtitle -->
  <g transform="translate(82, 0)">
    <text x="0" y="44" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" letter-spacing="4" fill="#1C1917">ANNADECO</text>
    <text x="2" y="62" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="3" fill="#78716C">INTERIORS &amp; LIVING JOURNAL</text>
    <line x1="2" y1="69" x2="220" y2="69" stroke="#E7E2DA" stroke-width="1" />
  </g>
</svg>
